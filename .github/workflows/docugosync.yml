name: DocuGoSync
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  pull-requests: write
  issues: write
jobs:
  documentation-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run DocuGoSync
        run: |
          python -m docugosync scan --repo . --base "${{ github.event.pull_request.base.sha }}" --output docugosync-report.md
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docugosync-report
          path: docugosync-report.md

      - name: Comment on Pull Request
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            if (!fs.existsSync('docugosync-report.md')) {
              core.notice('No DocuGoSync report found.');
              return;
            }

            const report = fs.readFileSync(
              'docugosync-report.md',
              'utf8'
            );

            const marker = '<!-- docugosync-report -->';
            const body = `${marker}\n${report}`;

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number }
            );

            const existing = comments.find(comment =>
              comment.user?.type === 'Bot' &&
              comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body
              });
            }

