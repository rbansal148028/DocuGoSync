[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docugosync"
version = "0.1.0"
description = "Detect documentation drift caused by code changes"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
docugosync = "docugosync.cli:main"

[tool.setuptools.packages.find]
include = ["docugosync*"]
